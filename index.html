<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شجرة الحسنات</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f5ef;--surf:#fff;--ink:#12403a;--mut:#5c7f78;--leaf:#2e9e6b;--leaf2:#1b6e4b;--gold:#f0aa22;--tawba:#5b5bd6;--tawba-bg:#ecebfb;--line:#cfe5dc;--sky:#d6eefb;--trunk:#8a5a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e2623;--surf:#173733;--ink:#e6f5ef;--mut:#9cbdb4;--leaf:#4ecb8f;--leaf2:#8fe3b8;--gold:#ffc44d;--tawba:#a5a5ff;--tawba-bg:#25254a;--line:#2a524b;--sky:#143a4a;--trunk:#b08060}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e2623;--surf:#173733;--ink:#e6f5ef;--mut:#9cbdb4;--leaf:#4ecb8f;--leaf2:#8fe3b8;--gold:#ffc44d;--tawba:#a5a5ff;--tawba-bg:#25254a;--line:#2a524b;--sky:#143a4a;--trunk:#b08060}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;font-size:17px;line-height:1.7;min-height:100vh}
.app{max-width:560px;margin:0 auto;padding:12px 14px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 10px}
h1{font-size:24px;margin:0;font-weight:800;color:var(--leaf2)}
h2{font-size:20px;margin:18px 0 8px;font-weight:800}
.mode{display:flex;background:var(--surf);border:2px solid var(--line);border-radius:999px;padding:3px}
.mode button{border:0;background:none;font:inherit;font-size:14px;color:var(--mut);padding:2px 12px;border-radius:999px;cursor:pointer}
.mode button[aria-pressed=true]{background:var(--leaf);color:#fff}
.ayah{background:var(--surf);border-radius:16px;padding:10px 14px;color:var(--mut);font-size:15px;text-align:center;border:2px solid var(--line)}
.stage{background:linear-gradient(var(--sky),var(--bg) 92%);border-radius:28px;margin-top:12px;padding:8px 8px 14px;text-align:center;border:2px solid var(--line)}
.stage svg{width:78%;max-width:300px;height:auto}
.lvl{font-weight:800;font-size:22px}
.nur{color:var(--gold);font-weight:800}
.bar{height:16px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .5s}
.card{background:var(--surf);border:2px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}
.card.t{background:var(--tawba-bg);border-color:var(--tawba)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-size:16px;color:var(--ink);background:var(--surf);border:2px solid var(--line);border-radius:18px;padding:12px 8px;cursor:pointer;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.35}
.opt b{font-size:28px;line-height:1}
.opt:active{transform:scale(.96)}
.opt.t{border-color:var(--tawba);background:var(--tawba-bg)}
.btn{font:inherit;font-size:16px;background:var(--leaf);color:#fff;border:0;border-radius:14px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn.t{background:var(--tawba);color:#fff}
.btn.g{background:none;color:var(--mut);border:2px solid var(--line)}
:root[data-theme="dark"] .btn,:root[data-theme="dark"] .btn.t{color:#0e2623}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn,:root:not([data-theme="light"]) .btn.t{color:#0e2623}}
input[type=text],input[type=number]{font:inherit;width:100%;border:2px solid var(--line);background:var(--surf);color:var(--ink);border-radius:14px;padding:8px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:120px}
nav{position:fixed;inset:auto 0 0 0;background:var(--surf);border-top:2px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px;z-index:5}
nav button{flex:1;max-width:120px;font:inherit;font-size:14px;color:var(--mut);background:none;border:0;border-radius:14px;padding:4px 2px;cursor:pointer;line-height:1.3}
nav button b{display:block;font-size:24px;line-height:1.2}
nav button[aria-selected=true]{background:var(--bg);color:var(--leaf2);font-weight:800}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{text-align:center;border:2px dashed var(--line);border-radius:20px;padding:12px 6px;color:var(--mut)}
.badge b{font-size:40px;display:block;filter:grayscale(1);opacity:.45}
.badge.on{border:2px solid var(--gold);color:var(--ink);background:var(--surf)}
.badge.on b{filter:none;opacity:1}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:8px}
.chart div{flex:1;text-align:center;font-size:12px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart i{display:block;background:var(--leaf);border-radius:8px 8px 0 0;min-height:3px}
.chart u{display:block;text-decoration:none;font-size:13px;color:var(--ink)}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) translateY(-120px);background:var(--leaf2);color:#fff;border-radius:16px;padding:8px 18px;transition:transform .35s;z-index:9;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.msg{background:var(--gold);color:#3a2800;border-radius:16px;padding:8px 14px;margin-top:10px;font-weight:600}
.small{font-size:14px;color:var(--mut)}
.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
<header>
<h1>🌳 شجرة الحسنات</h1>
<div class="mode" role="group" aria-label="الوضع"><button id="mChild" aria-pressed="true">طفل</button><button id="mParent" aria-pressed="false">ولي أمر</button></div>
</header>
<div class="ayah">﴿إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ﴾</div>
<main id="view"></main>
</div>
<nav id="nav" role="tablist"></nav>
<div class="toast" id="toast" role="status"></div>
<script>
const GOOD=[["prayer","🕌","الصلاة في وقتها"],["parents","💞","بر الوالدين وسماع الكلام"],["quran","📖","قراءة صفحة من القرآن"],["help","🤝","مساعدة إخوتي أو أصدقائي"],["truth","⭐","قول الصدق"],["road","🌿","إماطة الأذى عن الطريق"]];
const BAD=[["😠","الغضب أو الصراخ"],["🙉","عدم سماع كلام الوالدين"],["⏰","التأخر عن الصلاة"],["🤐","قول كلمة غير لائقة"]];
const BADGES=[["truth","⭐","نجم الأمانة","٣ مرات صدق"],["prayer","🛡️","فارس الصلاة","٣ صلوات في وقتها"],["quran","📚","صديق القرآن","٣ صفحات قرآن"],["forgive","🕊️","بطل التسامح","٣ أخطاء تم محوها"]];
const LV=[[0,"بذرة"],[20,"برعم"],[60,"شتلة"],[120,"شجرة"],[200,"شجرة مزهرة"],[300,"شجرة مثمرة"]];
const ATONE=["أستغفر الله ٣ مرات","اعتذرت لمن أخطأت في حقه","قبّلت رأس أمي أو أبي","تصدقت من مصروفي"];
const CHEER=["فخورين بك يا بطل 🌟","استمر، شجرتك تكبر!","الله يحبك لأنك تتوب 💚","أنت قدوة لإخوتك"];
const K="shajara-v1";
let S={log:[],pending:[],reward:{text:"رحلة إلى الحديقة",goal:10},msgs:[]};
try{const r=JSON.parse(localStorage.getItem(K));if(r&&r.log)S=r}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const day=d=>{const x=d||new Date();return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate()};
const $=id=>document.getElementById(id);
let tab="tree",parent=false,tick={};
const good=()=>S.log.filter(l=>l.t==="g");
const points=()=>good().length*10+S.log.filter(l=>l.t==="e").length*5;
const lvIdx=p=>{let i=0;LV.forEach((l,k)=>{if(p>=l[0])i=k});return i};
const weekGood=()=>{const n=Date.now();return good().filter(l=>n-l.ts<6048e5).length};
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function tree(s){
const th=[0,22,44,66,84,96][s];
let g=`<svg viewBox="0 0 200 220" role="img" aria-label="شجرتك في المرحلة ${s}"><ellipse cx="100" cy="196" rx="84" ry="14" fill="var(--leaf)" opacity=".35"/>`;
if(s===0)return g+`<ellipse cx="100" cy="186" rx="22" ry="11" fill="var(--trunk)"/><ellipse cx="100" cy="180" rx="7" ry="5" fill="var(--gold)"/></svg>`;
g+=`<path d="M92 196 Q96 ${196-th} 94 ${196-th-6} L106 ${196-th-6} Q104 ${196-th} 108 196Z" fill="var(--trunk)"/>`;
const top=196-th-6;
const C=[[100,top,26],[78,top+8,20],[122,top+8,20],[100,top-26,22],[70,top-16,16],[130,top-16,16],[100,top-50,16],[84,top-40,14],[116,top-40,14]];
const n=[0,1,3,5,7,9][s];
C.slice(0,n).forEach((c,i)=>g+=`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="${i%2?"var(--leaf)":"var(--leaf2)"}"/>`);
if(s>=4)C.slice(0,n).forEach((c,i)=>g+=`<circle cx="${c[0]+(i%3-1)*6}" cy="${c[1]-4+(i%2)*8}" r="4" fill="#f58fb4"/>`);
if(s>=5)C.slice(1,n).forEach((c,i)=>g+=`<circle cx="${c[0]+6}" cy="${c[1]+10}" r="5" fill="var(--gold)"/>`);
return g+"</svg>"}
function badgeOn(k){if(k==="forgive")return S.log.filter(l=>l.t==="e").length>=3;return good().filter(l=>l.k===k).length>=3}
function viewTree(){
const p=points(),i=lvIdx(p),nx=LV[i+1],pc=nx?Math.round((p-LV[i][0])/(nx[0]-LV[i][0])*100):100,w=weekGood(),R=S.reward,rp=Math.min(100,Math.round(w/R.goal*100));
const m=S.msgs.length?`<div class="msg">💌 رسالة من أهلك: ${esc(S.msgs[S.msgs.length-1])}</div>`:"";
return `<div class="stage"><div id="tr">${tree(i)}</div><div class="lvl">${LV[i][1]}</div><div><span class="nur">✨ ${p} نور</span></div><div class="bar" style="margin:8px 18px"><i style="width:${pc}%"></i></div><div class="small">${nx?"باقي "+(nx[0]-p)+" نور لتصير «"+nx[1]+"»":"وصلت لأعلى مرحلة، ما شاء الله!"}</div></div>${m}
<div class="card"><b>🎁 مكافأة الأسبوع: ${esc(R.text)}</b><div class="bar"><i style="width:${rp}%;background:var(--gold)"></i></div><div class="small">${w} من ${R.goal} حسنات هذا الأسبوع</div></div>`}
function viewGood(){
return `<h2>ماذا عملت من خير اليوم؟</h2><div class="grid">${GOOD.map(g=>`<button class="opt" data-g="${g[0]}"><b>${g[1]}</b>${g[2]}</button>`).join("")}</div>
<div class="card"><label for="cg">حسنة أخرى:</label><div class="row"><input type="text" id="cg" maxlength="40" placeholder="اكتب حسنتك"><button class="btn" id="addg">أضف</button></div></div>
<p class="small">كل حسنة تعطيك ١٠ نور، فالحسنة بعشر أمثالها 💚</p>`}
function viewTawba(){
const P=S.pending.map((x,j)=>`<div class="card t"><b>${x.i} ${esc(x.l)}</b><p class="small" style="margin:2px 0 8px">لا بأس، كلنا نخطئ. اختر ما يمحوها:</p><div class="row">${ATONE.map((a,k)=>`<button class="btn t" data-m="${j}" data-k="${k}">${k===0?"أستغفر ("+(tick[x.id]||0)+"/٣)":a}</button>`).join("")}</div></div>`).join("");
return `<h2>باب التوبة والاعتذار</h2><p class="small" style="margin-top:-6px">لا يُخصم شيء من رصيدك. اختر ما حصل ثم امحُه بعمل طيب.</p>${P||'<div class="card t">لا توجد أخطاء الآن، الحمد لله 🌸</div>'}
<h2>ماذا حصل؟</h2><div class="grid">${BAD.map((b,j)=>`<button class="opt t" data-b="${j}"><b>${b[0]}</b>${b[1]}</button>`).join("")}</div>`}
function viewBadges(){
return `<h2>أوسمتي</h2><div class="badges">${BADGES.map(b=>`<div class="badge ${badgeOn(b[0])?"on":""}"><b>${b[1]}</b><div>${b[2]}</div><div class="small">${b[3]}</div></div>`).join("")}</div>`}
function viewParent(){
const days=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5);days.push([day(d),["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"][d.getDay()]])}
const cnt=days.map(d=>S.log.filter(l=>l.t==="g"&&l.d===d[0]).length),mx=Math.max(1,...cnt);
const er=S.log.filter(l=>l.t==="e"&&Date.now()-l.ts<6048e5).length,mk=S.log.filter(l=>l.t==="b"&&Date.now()-l.ts<6048e5).length;
const rec=S.log.slice(-6).reverse().map(l=>`<li>${l.t==="g"?"✅ "+esc(l.l):l.t==="b"?"💭 "+esc(l.l):"🕊️ محا: "+esc(l.l)}</li>`).join("");
return `<h2>لوحة ولي الأمر</h2><div class="card"><b>الحسنات خلال آخر ٧ أيام</b><div class="chart">${cnt.map((c,i)=>`<div><u>${c}</u><i style="height:${c/mx*80}px"></i>${days[i][1]}</div>`).join("")}</div><p class="small" style="margin:8px 0 0">أخطاء مسجّلة: ${mk} · تم محوها: ${er}</p></div>
<div class="card"><b>آخر النشاطات</b><ul style="padding-inline-start:20px;margin:6px 0">${rec||"<li class='small'>لا يوجد نشاط بعد</li>"}</ul></div>
<div class="card"><b>🎁 مكافأة الأسبوع</b><label class="small" for="rt">المكافأة</label><input type="text" id="rt" value="${esc(S.reward.text)}" maxlength="40"><label class="small" for="rg">عدد الحسنات المطلوبة</label><div class="row"><input type="number" id="rg" min="1" max="100" value="${S.reward.goal}"><button class="btn" id="svr">حفظ</button></div></div>
<div class="card"><b>💌 رسالة تشجيع للطفل</b><div class="row" style="margin:8px 0">${CHEER.map((c,i)=>`<button class="btn g" data-c="${i}">${c}</button>`).join("")}</div><div class="row"><input type="text" id="cm" maxlength="60" placeholder="أو اكتب رسالتك"><button class="btn" id="sendm">أرسل</button></div></div>
<button class="btn g" id="reset" style="margin-top:14px">مسح كل البيانات</button>`}
function render(){
const v=parent?viewParent():{tree:viewTree,good:viewGood,tawba:viewTawba,badges:viewBadges}[tab]();
$("view").innerHTML=v;
const T=[["tree","🌳","شجرتي"],["good","🌟","حسنة"],["tawba","🤲","توبة"],["badges","🏅","أوسمتي"]];
$("nav").hidden=parent;
$("nav").innerHTML=T.map(t=>`<button role="tab" data-tab="${t[0]}" aria-selected="${tab===t[0]}"><b>${t[1]}</b>${t[2]}</button>`).join("");
$("mChild").setAttribute("aria-pressed",!parent);$("mParent").setAttribute("aria-pressed",parent)}
function addGood(k,l){
const b=badgeOn.bind(null),before=BADGES.filter(x=>badgeOn(x[0])).length;
S.log.push({t:"g",k,l,d:day(),ts:Date.now()});save();
const after=BADGES.filter(x=>badgeOn(x[0])).length;
toast(after>before?"🏅 حصلت على وسام جديد!":"ما شاء الله! +١٠ نور ✨");tab="tree";render();
const t=$("tr");if(t)t.classList.add("pop")}
function erase(x){
S.pending=S.pending.filter(p=>p.id!==x.id);S.log.push({t:"e",l:x.l,d:day(),ts:Date.now()});save();
toast("تم محو الخطأ 🕊️ إن الحسنات يذهبن السيئات");render()}
document.addEventListener("click",e=>{
const q=s=>e.target.closest(s);let el;
if(q("#mChild")){parent=false;render();return}
if(q("#mParent")){parent=true;render();return}
if(el=q("[data-tab]")){tab=el.dataset.tab;render();return}
if(el=q("[data-g]")){const g=GOOD.find(x=>x[0]===el.dataset.g);addGood(g[0],g[2]);return}
if(q("#addg")){const v=$("cg").value.trim();if(v)addGood("custom",v);return}
if(el=q("[data-b]")){const b=BAD[+el.dataset.b],id=Date.now();S.pending.push({id,i:b[0],l:b[1]});S.log.push({t:"b",l:b[1],d:day(),ts:id});save();toast("تذكّر: التوبة تمحو الخطأ 💜");render();return}
if(el=q("[data-m]")){const x=S.pending[+el.dataset.m],k=+el.dataset.k;
if(k===0){tick[x.id]=(tick[x.id]||0)+1;if(tick[x.id]>=3)erase(x);else render()}else erase(x);return}
if(q("#svr")){S.reward={text:$("rt").value.trim()||"مكافأة",goal:Math.max(1,+$("rg").value||10)};save();toast("تم حفظ المكافأة ✅");return}
if(el=q("[data-c]")){S.msgs.push(CHEER[+el.dataset.c]);save();toast("وصلت الرسالة 💌");return}
if(q("#sendm")){const v=$("cm").value.trim();if(v){S.msgs.push(v);save();$("cm").value="";toast("وصلت الرسالة 💌")}return}
if(q("#reset")){if(confirm("مسح كل الحسنات والإعدادات؟")){S={log:[],pending:[],reward:{text:"رحلة إلى الحديقة",goal:10},msgs:[]};save();render()}}
});
render();
</script>
</body>
</html>
